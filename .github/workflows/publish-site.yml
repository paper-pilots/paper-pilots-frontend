# Kopiert index.html bei jedem Push auf main ins öffentliche Repository
# paper-pilots/paper-pilots.github.io (Spielseite https://paper-pilots.github.io/).
# Braucht das Secret SITE_DEPLOY_KEY (privater Teil eines Deploy-Keys mit
# Schreibrecht im öffentlichen Repository).
name: Spielseite veröffentlichen

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Quelle auschecken
        uses: actions/checkout@v4
        with:
          path: source

      - name: Spielseite auschecken
        uses: actions/checkout@v4
        with:
          repository: paper-pilots/paper-pilots.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site

      - name: index.html kopieren und pushen
        working-directory: site
        run: |
          cp ../source/index.html index.html
          if git diff --quiet; then
            echo "index.html ist unverändert, nichts zu tun."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Spielseite aus paper-pilots-frontend (${GITHUB_SHA::7})"
          git push
